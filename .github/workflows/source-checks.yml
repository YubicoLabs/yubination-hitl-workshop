name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -B -S integrations/previewsign/scripts/test_package_macos_chrome.py
      - run: python3 -B integrations/previewsign/scripts/generate_installation_facts.py --check
      - run: python3 -B -S scripts/check_participant_alignment.py
