<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Choose Account</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 20px;
  }
  .dialog { width: 100%; max-width: 360px; }
  h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .message { font-size: 13px; color: #555; margin-bottom: 12px; }
  .accounts { list-style: none; margin-bottom: 16px; }
  .accounts li {
    padding: 10px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 14px;
    color: #1a1a1a;
    transition: background 0.1s;
  }
  .accounts li:hover { background: #f0f5ff; border-color: #0066cc; }
  .accounts li:active { background: #e0ecff; }
  .buttons { display: flex; justify-content: flex-end; }
  .cancel {
    background: #f0f0f0;
    color: #333;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="dialog">
  <h1>Choose an Account</h1>
  <div class="message">Select which account to use:</div>
  <ul class="accounts" id="accounts"></ul>
  <div class="buttons">
    <button class="cancel" id="cancelBtn">Cancel</button>
  </div>
</div>
<script src="select.js"></script>
</body>
</html>
