[package]
name = "sign-extension-service"
version = "0.1.0"
edition = "2021"
description = "Windows service owning YubiKey HID + PIN entry for previewSign FIDO bridge"

[[bin]]
name = "sign-extension-service"
path = "src/main.rs"

[dependencies]
yubikit = { git = "https://github.com/Yubico/yubikey-manager", branch = "experiment/rust", package = "yubikit" }
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_WinTrust",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
] }
base64 = "0.22"
sign-extension-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[build-dependencies]
embed-manifest = "1"
