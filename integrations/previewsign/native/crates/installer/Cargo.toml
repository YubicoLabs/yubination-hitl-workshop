[package]
name = "sign-extension-installer"
version = "0.1.0"
edition = "2021"
description = "Install/uninstall CLI for previewSign FIDO bridge"

[[bin]]
name = "sign-extension-installer"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
